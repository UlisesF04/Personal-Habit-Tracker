spring.application.name=demo

# Database — local defaults, override via Aiven env on Render
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/habit_tracker}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:ulises2004}
# Aiven MySQL requires SSL in prod; append ?sslMode=REQUIRED via DB_URL if needed
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

server.port=${PORT:8080}
server.forward-headers-strategy=framework

# JWT — override on Render via JWT_SECRET env
app.jwt.secret=${JWT_SECRET:ulises_habit_tracker_super_secret_key_2026_secure}
app.jwt.expiration-ms=3600000

# Actuator for Render health check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.db.enabled=true